<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD Mass Check</title>
<style>
  :root{
    --bg:#f4f6f8;
    --panel:#ffffff;
    --ink:#1a2230;
    --ink-soft:#5b6879;
    --line:#d8dee7;
    --accent:#1f5fa9;
    --accent-soft:#e8f0fa;
    --pass:#1a7f4b;
    --pass-bg:#e6f5ed;
    --fail:#b3341f;
    --fail-bg:#fdecea;
    --warn:#8a6100;
    --warn-bg:#fdf3dc;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1440px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .hdr{
    display:flex;align-items:center;gap:20px;
    padding:14px 20px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:12px;flex:1 1 320px;min-width:0}
  .brand h1{
    margin:0;font-size:20px;letter-spacing:-.01em;cursor:pointer;
    white-space:nowrap;
  }
  .brand p{margin:0;font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .namebox{display:flex;align-items:center;gap:8px}
  .namebox label{font-size:13px;color:var(--ink-soft);font-weight:600}
  .namebox input{
    font:inherit;font-size:14px;padding:7px 10px;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
    width:190px;
  }
  .namebox input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

  /* ---------- gallery ---------- */
  main{padding:28px 0 60px}
  .setblock{margin-bottom:34px}
  .setblock h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin:0 0 12px;font-weight:700;
  }
  .grid{
    display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;
    box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;
    display:flex;flex-direction:column;gap:8px;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card .cname{font-weight:650;font-size:16px}
  .card .cmat{font-size:13px;color:var(--ink-soft)}
  .badge{
    align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 8px;border-radius:99px;
    background:var(--accent-soft);color:var(--accent);
  }
  .card .done{
    align-self:flex-start;font-size:12px;font-weight:700;color:var(--pass);
  }
  .empty{
    background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
    padding:40px;text-align:center;color:var(--ink-soft);
  }

  /* ---------- detail ---------- */
  .back{
    background:none;border:0;font:inherit;font-size:14px;font-weight:600;
    color:var(--accent);cursor:pointer;padding:0;margin-bottom:14px;
  }
  .back:hover{text-decoration:underline}
  .detail{
    display:grid;gap:18px;
    grid-template-columns:minmax(0,1fr) 300px;
    align-items:start;
  }
  @media (max-width:900px){ .detail{grid-template-columns:1fr} }

  .drawing{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .drawing .dtop{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:9px 12px;border-bottom:1px solid var(--line);
  }
  .drawing .dtop strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dtools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .tbtn{
    font:inherit;font-size:13px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border:1px solid transparent;border-radius:7px;
    padding:5px 10px;cursor:pointer;text-decoration:none;white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--accent)}
  .viewer{
    aspect-ratio:var(--sheet, 17/11);
    max-height:calc(100vh - 170px);
    background:#fff;
  }
  @supports not (aspect-ratio:1/1){ .viewer{height:70vh} }
  .viewer object,.viewer iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  .pdffall{padding:30px;text-align:center;color:var(--ink-soft);font-size:14px}

  /* enlarged drawing */
  .drawing.fs{
    position:fixed;inset:0;z-index:100;border-radius:0;border:0;
    display:flex;flex-direction:column;
  }
  .drawing.fs .viewer{aspect-ratio:auto;max-height:none;flex:1 1 auto;min-height:0}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px;
  }
  .panel h2{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
  .panel .sub{margin:0 0 16px;font-size:13px;color:var(--ink-soft)}

  .specs{border-top:1px solid var(--line);margin:0 0 18px}
  .specs div{
    display:flex;justify-content:space-between;gap:14px;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;
  }
  .specs dt{color:var(--ink-soft)}
  .specs dd{margin:0;font-weight:650;text-align:right}

  .note{
    background:var(--warn-bg);color:var(--warn);border-radius:8px;
    padding:10px 12px;font-size:13px;margin:0 0 16px;
  }

  label.big{display:block;font-weight:650;font-size:14px;margin-bottom:6px}
  .inputrow{display:flex;gap:8px}
  .inputrow input{
    flex:1;min-width:0;font:inherit;font-size:19px;font-variant-numeric:tabular-nums;
    padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  .inputrow input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .unit{
    display:flex;align-items:center;padding:0 12px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;font-size:15px;color:var(--ink-soft);font-weight:600;
  }
  .btn{
    width:100%;margin-top:12px;padding:12px;font:inherit;font-size:16px;font-weight:700;
    background:var(--accent);color:#fff;border:0;border-radius:8px;cursor:pointer;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .result{margin-top:16px;border-radius:var(--radius);padding:16px;display:none}
  .result.show{display:block}
  .result .rtitle{font-size:20px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .result .rbody{margin:0;font-size:14px}
  .result.pass{background:var(--pass-bg);color:var(--pass);border:1px solid rgba(26,127,75,.25)}
  .result.fail{background:var(--fail-bg);color:var(--fail);border:1px solid rgba(179,52,31,.25)}
  .result.warn{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(138,97,0,.25)}
  .stamp{
    margin-top:12px;padding-top:10px;border-top:1px solid currentColor;
    opacity:.75;font-size:12.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }

  /* ---------- teacher ---------- */
  .teach{max-width:640px;margin:0 auto}
  .teach code{background:var(--bg);padding:2px 6px;border-radius:5px;font-size:13px}
  .teach .out{
    margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;
    word-break:break-all;
  }
  footer{padding:20px 0 40px;text-align:center;font-size:12px;color:var(--ink-soft)}
  footer a{color:var(--ink-soft)}
</style>
</head>
<body>

<header>
  <div class="wrap hdr">
    <div class="brand">
      <h1 id="brandTitle">CAD Mass Check</h1>
      <p id="brandSub"></p>
    </div>
    <div class="namebox">
      <label for="studentName">Your name</label>
      <input id="studentName" type="text" placeholder="First Last" autocomplete="off" spellcheck="false">
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<footer class="wrap">
  Check your mass, then screenshot the result panel and turn it in.
</footer>

<script src="parts.js"></script>
<script>
(function () {
  "use strict";

  var S = window.SETTINGS || {};
  var LIST = window.PARTS || [];
  var view = document.getElementById("view");
  var nameInput = document.getElementById("studentName");

  document.title = S.title || "CAD Mass Check";
  document.getElementById("brandTitle").textContent = S.title || "CAD Mass Check";
  document.getElementById("brandSub").textContent = S.subtitle || "";

  var UNIT = S.unitLabel || "oz";
  var UNIT_LONG = S.unitLong || "ouncemass";
  var DEC = typeof S.displayDecimals === "number" ? S.displayDecimals : 3;
  var DEFAULT_TOL = typeof S.defaultTolerancePct === "number" ? S.defaultTolerancePct : 1;

  // attempts + passes for this browser session only (nothing is saved or sent)
  var attempts = {};
  var passed = {};
  var studentName = "";

  nameInput.addEventListener("input", function () { studentName = nameInput.value; });

  /* ---------- answer-key scrambling (speed bump, not security) ---------- */
  var OFFSET = 918273;
  function encodeMass(oz) {
    var n = Math.round(Number(oz) * 10000) + OFFSET;
    return n.toString(36).split("").reverse().join("");
  }
  function decodeMass(key) {
    var n = parseInt(String(key).split("").reverse().join(""), 36);
    if (!isFinite(n)) return NaN;
    return (n - OFFSET) / 10000;
  }
  function targetOf(p) {
    if (p.massKey) return decodeMass(p.massKey);
    return Number(p.massOz);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(html) {
    var d = document.createElement("div");
    d.innerHTML = html.trim();
    return d.firstElementChild;
  }
  function fmt(n, d) { return Number(n).toFixed(d == null ? DEC : d); }

  /* ---------- routing ---------- */
  function route() {
    document.body.style.overflow = "";
    var h = location.hash.replace(/^#/, "");
    if (h === "teacher") return renderTeacher();
    var m = h.match(/^part=(.+)$/);
    if (m) {
      var p = LIST.filter(function (x) { return x.id === decodeURIComponent(m[1]); })[0];
      if (p) return renderPart(p);
    }
    renderGallery();
  }
  window.addEventListener("hashchange", route);
  document.getElementById("brandTitle").addEventListener("click", function () {
    location.hash = "";
  });

  /* ---------- gallery ---------- */
  function renderGallery() {
    view.innerHTML = "";
    if (!LIST.length) {
      view.appendChild(el('<div class="empty">No parts yet. Add one in <b>parts.js</b>.</div>'));
      return;
    }
    var sets = [];
    LIST.forEach(function (p) {
      var key = p.set || "Parts";
      var g = sets.filter(function (s) { return s.key === key; })[0];
      if (!g) { g = { key: key, items: [] }; sets.push(g); }
      g.items.push(p);
    });

    sets.forEach(function (g) {
      var block = el('<section class="setblock"><h2>' + esc(g.key) + '</h2><div class="grid"></div></section>');
      var grid = block.querySelector(".grid");
      g.items.forEach(function (p) {
        var card = el(
          '<button class="card" type="button">' +
            (p.level ? '<span class="badge">' + esc(p.level) + "</span>" : "") +
            '<span class="cname">' + esc(p.name) + "</span>" +
            '<span class="cmat">' + esc(p.material || "") + "</span>" +
            (passed[p.id] ? '<span class="done">&#10003; Passed</span>' : "") +
          "</button>"
        );
        card.addEventListener("click", function () {
          location.hash = "part=" + encodeURIComponent(p.id);
        });
        grid.appendChild(card);
      });
      view.appendChild(block);
    });
  }

  /* ---------- part detail ---------- */
  function renderPart(p) {
    var tol = typeof p.tolerance === "number" ? p.tolerance : DEFAULT_TOL;
    view.innerHTML = "";

    var back = el('<button class="back" type="button">&#8592; All parts</button>');
    back.addEventListener("click", function () { location.hash = ""; });
    view.appendChild(back);

    var pdfPath = "drawings/" + p.drawing;
    var sheet = p.sheet || S.sheetAspect || "17/11";
    var wrapEl = el(
      '<div class="detail">' +
        '<div class="drawing" id="dwg">' +
          '<div class="dtop"><strong>' + esc(p.name) + ' &mdash; Drawing</strong>' +
            '<span class="dtools">' +
              '<button class="tbtn" id="fsBtn" type="button">Enlarge</button>' +
              '<a class="tbtn" href="' + esc(pdfPath) + '" target="_blank" rel="noopener">New tab &#8599;</a>' +
            "</span>" +
          "</div>" +
          '<div class="viewer" style="--sheet:' + esc(sheet) + '">' +
            '<object data="' + esc(pdfPath) + '#view=Fit&amp;navpanes=0" type="application/pdf">' +
              '<div class="pdffall">Your browser will not display the PDF here. ' +
              '<a href="' + esc(pdfPath) + '" target="_blank" rel="noopener">Open the drawing in a new tab</a>.</div>' +
            "</object>" +
          "</div>" +
        "</div>" +
        '<div class="panel">' +
          "<h2>" + esc(p.name) + "</h2>" +
          '<p class="sub">Model this part in Fusion, then check your mass below.</p>' +
          '<dl class="specs">' +
            "<div><dt>Material to apply</dt><dd>" + esc(p.material || "&mdash;") + "</dd></div>" +
            "<div><dt>Units to report</dt><dd>" + esc(UNIT_LONG) + " (" + esc(UNIT) + ")</dd></div>" +
            "<div><dt>Tolerance</dt><dd>&plusmn;" + tol + "%</dd></div>" +
          "</dl>" +
          (p.note ? '<p class="note">' + esc(p.note) + "</p>" : "") +
          '<label class="big" for="massIn">Mass from Fusion</label>' +
          '<div class="inputrow">' +
            '<input id="massIn" type="text" inputmode="decimal" autocomplete="off" placeholder="0.000">' +
            '<span class="unit">' + esc(UNIT) + "</span>" +
          "</div>" +
          '<button class="btn" id="checkBtn" type="button">Check my mass</button>' +
          '<div class="result" id="result" role="status" aria-live="polite"></div>' +
        "</div>" +
      "</div>"
    );
    view.appendChild(wrapEl);

    var input = wrapEl.querySelector("#massIn");
    var btn = wrapEl.querySelector("#checkBtn");
    var res = wrapEl.querySelector("#result");

    function show(kind, title, body) {
      res.className = "result show " + kind;
      res.innerHTML =
        '<p class="rtitle">' + title + "</p>" +
        '<p class="rbody">' + body + "</p>" +
        '<div class="stamp">' +
          "<span>" + (studentName ? esc(studentName) : "<i>no name entered</i>") + " &middot; " + esc(p.name) + "</span>" +
          "<span>Attempt " + (attempts[p.id] || 0) + " &middot; " + new Date().toLocaleString() + "</span>" +
        "</div>";
    }

    function check() {
      var raw = String(input.value || "").trim().replace(/,/g, "");
      raw = raw.replace(/(ounce\s*mass|ouncemass|ounces|ounce|lbmass|lbm|lbs|lb|oz|g)\b/gi, "").trim();
      var val = Number(raw);

      if (raw === "" || !isFinite(val)) {
        show("warn", "Enter a number", "Type the mass Fusion reports, using digits only &mdash; for example <b>" + fmt(1.234) + "</b>.");
        return;
      }
      if (val <= 0) {
        show("warn", "Check that value", "Mass has to be greater than zero.");
        return;
      }

      var target = targetOf(p);
      if (!isFinite(target)) {
        show("warn", "No answer key set", "This part has no target mass yet. Let your teacher know.");
        return;
      }

      attempts[p.id] = (attempts[p.id] || 0) + 1;
      var band = Math.abs(target) * (tol / 100);
      var diff = val - target;

      if (Math.abs(diff) <= band) {
        passed[p.id] = true;
        show("pass", "&#10003; Correct",
          "Your mass of <b>" + fmt(val) + " " + UNIT + "</b> is within &plusmn;" + tol + "%. " +
          "Screenshot this panel and turn it in.");
      } else {
        var dir = "";
        if (S.showDirection !== false) {
          dir = diff > 0
            ? "Your part is <b>too heavy</b>. Look for extra material &mdash; a missing cut, a hole you didn't make, or a thickness that's too large."
            : "Your part is <b>too light</b>. Look for missing material &mdash; a feature you left out, or a dimension that's too small.";
        } else {
          dir = "Recheck your dimensions and features against the drawing.";
        }
        show("fail", "&#10007; Not yet",
          "<b>" + fmt(val) + " " + UNIT + "</b> is outside the &plusmn;" + tol + "% window. " + dir +
          "<br><br>Also confirm you applied <b>" + esc(p.material || "the right material") + "</b> and that Fusion is reporting <b>" + esc(UNIT_LONG) + "</b>.");
      }
    }

    btn.addEventListener("click", check);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });

    // enlarge / restore the drawing
    var dwg = wrapEl.querySelector("#dwg");
    var fsBtn = wrapEl.querySelector("#fsBtn");
    function setFs(on) {
      dwg.classList.toggle("fs", on);
      fsBtn.textContent = on ? "Close" : "Enlarge";
      document.body.style.overflow = on ? "hidden" : "";
    }
    fsBtn.addEventListener("click", function () { setFs(!dwg.classList.contains("fs")); });
    document.addEventListener("keydown", function esc(e) {
      if (!document.body.contains(dwg)) { document.removeEventListener("keydown", esc); return; }
      if (e.key === "Escape" && dwg.classList.contains("fs")) setFs(false);
    });

    input.focus();
  }

  /* ---------- teacher panel ---------- */
  function renderTeacher() {
    view.innerHTML = "";
    var back = el('<button class="back" type="button">&#8592; All parts</button>');
    back.addEventListener("click", function () { location.hash = ""; });
    view.appendChild(back);

    var box = el(
      '<div class="panel teach">' +
        "<h2>Teacher: answer-key encoder</h2>" +
        '<p class="sub">Turns a mass into a scrambled token so the number is not readable in view-source. ' +
        "Paste the token into the part's <code>massKey</code> field and delete its <code>massOz</code>. " +
        "This is a speed bump for curious students, not real security.</p>" +
        '<label class="big" for="encIn">Mass in ' + esc(UNIT_LONG) + "</label>" +
        '<div class="inputrow"><input id="encIn" type="text" inputmode="decimal" placeholder="4.412"><span class="unit">' + esc(UNIT) + "</span></div>" +
        '<button class="btn" id="encBtn" type="button">Encode</button>' +
        '<div class="out" id="encOut">massKey: &mdash;</div>' +
      "</div>"
    );
    view.appendChild(box);

    box.querySelector("#encBtn").addEventListener("click", function () {
      var v = Number(String(box.querySelector("#encIn").value).trim());
      var out = box.querySelector("#encOut");
      if (!isFinite(v) || v <= 0) { out.textContent = "Enter a positive number."; return; }
      var k = encodeMass(v);
      out.textContent = 'massKey: "' + k + '",   // ' + fmt(v) + " " + UNIT + "  (decodes to " + fmt(decodeMass(k)) + ")";
    });
  }

  route();
})();
</script>
</body>
</html>
